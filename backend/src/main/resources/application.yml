# Doc bien moi truong tu file .env o thu muc goc repo (neu co) - khong commit .env
spring:
  config:
    import: "optional:file:../.env[.properties],optional:file:./.env[.properties]"
  application:
    name: tiecnha-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:mariadb://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_NAME:tiecnha}?characterEncoding=UTF-8
    username: ${DB_USER:tiecnha}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  flyway:
    enabled: true
  jackson:
    time-zone: Asia/Ho_Chi_Minh

server:
  port: ${PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  brand-name: "Tiệc Nhà"
  jwt-secret: ${JWT_SECRET}
  jwt-ttl-hours: 24
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  seed-demo: false
